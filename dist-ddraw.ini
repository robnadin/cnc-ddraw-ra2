; cnc-ddraw-ra2 - https://github.com/gitTerebi/cnc-ddraw-ra2
;
; Trimmed to Red Alert 2 / Yuri's Revenge. Upstream cnc-ddraw ships profiles for
; hundreds of games; this file keeps the global defaults and the RA2 exes only.
;
; The setting that matters is fixchilds=5, which keeps the menus clickable while
; the game is upscaled. Stock cnc-ddraw ignores the value 5 and falls back to its
; default, so if your menus are misaligned you are not running this build.
;
; Mental Omega: also set fixchilds=5 in Resources\cnc-ddraw.ini. The MO client
; copies that file over ddraw.ini whenever you save settings.

[ddraw]
width=0
height=0
fullscreen=false
windowed=true
maintas=true
aspect_ratio=
boxing=false
maxfps=-1
vsync=false
adjmouse=true

; Single shader, or a |-separated chain (this fork only; upstream takes one).
shader=Shaders\xbrz\4xbrz.glsl

posX=-32000
posY=-32000
renderer=opengl
devmode=false
border=false
savesettings=1
resizable=true
d3d9_filter=2
anti_aliased_fonts_min_size=13
min_font_size=0
center_window=0
inject_resolution=1024x768
vhack=false
screenshotdir=.\Screenshots\
toggle_borderless=false
toggle_upscaled=false
noactivateapp=false
maxgameticks=0
limiter_type=0
minfps=0
nonexclusive=true
singlecpu=true
resolutions=0

; 0 = off, 1 = top left, 2 = top left + repaint, 3 = hide, 4 = top left + hide,
; 5 = hide + remap input  <- keeps upscaling and moves the click targets to match
fixchilds=5

hook_peekmessage=false
fix_alt_key_stuck=false
game_handles_close=false
fix_not_responding=false
no_compat_warning=false
guard_lines=200
max_resolutions=0
lock_surfaces=false
flipclear=false
rgb555=false
no_dinput_hook=false
center_cursor_fix=false
lock_mouse_top_left=false
hook=4
limit_gdi_handles=false
remove_menu=false
refresh_rate=0
keytogglefullscreen=0x0D
keytogglefullscreen2=0x00
keytogglemaximize=0x22
keytogglemaximize2=0x00
keyunlockcursor1=0x09
keyunlockcursor2=0xA3
keyscreenshot=0x2C
configlang=auto
configtheme=Windows10
hide_compat_tab=false
allow_reset=true

[game]
nonexclusive=true
checkfile=.\blowfish.dll
tshack=true
noactivateapp=true
adjmouse=true
maxfps=60
minfps=-1
maintas=true
boxing=false
renderer=opengl
fixchilds=5

[ra2]
nonexclusive=true
noactivateapp=true
tshack=true
maxfps=60
minfps=-1
maintas=true
boxing=false
renderer=opengl
fixchilds=5

[gamemd]
nonexclusive=true
noactivateapp=true
tshack=true
maxfps=60
minfps=-1
maintas=true
boxing=false
renderer=opengl
fixchilds=5

[ra2md]
nonexclusive=true
noactivateapp=true
tshack=true
maxfps=60
minfps=-1
maintas=true
boxing=false
renderer=opengl
fixchilds=5

[gamemd-spawn]
nonexclusive=true
noactivateapp=true
tshack=true
maxfps=60
minfps=-1
maintas=true
boxing=false
renderer=opengl
fixchilds=5

; Merge these snippets into the named files; do not replace a whole INI.
; For RA2.INI AND RA2MD.INI:
; [Intro]
; Play=no
; [Video]
; ScreenWidth=1280
; ScreenHeight=800
; AllowHiResModes=yes
; StretchMovies=no

; For ddraw.ini:
[ddraw]
renderer=opengl
fullscreen=true
windowed=true
maintas=true
boxing=false
border=false
adjmouse=true
savesettings=0
shader=
resolutions=2
inject_resolution=1280x800

[game]
fixchilds=5
maintas=true
boxing=false
resolutions=2
inject_resolution=1280x800

[ra2]
fixchilds=5
maintas=true
boxing=false
resolutions=2
inject_resolution=1280x800

[gamemd]
fixchilds=5
async_child_setup=true
maintas=true
boxing=false
resolutions=2
inject_resolution=1280x800
adjmouse=true

[ra2md]
fixchilds=5
async_child_setup=true
maintas=true
boxing=false
resolutions=2
inject_resolution=1280x800
adjmouse=true
